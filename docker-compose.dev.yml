# Postgres cho môi trường dev: docker compose -f docker-compose.dev.yml up -d
name: ads-mcp-dev
services:
  db:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_USER: adsmcp
      POSTGRES_DB: adsmcp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}"
    # log_parameter_max_length*=0: never write bind parameters (secrets, emails…) into the Postgres log.
    command:
      [
        "postgres",
        "-c",
        "default_toast_compression=lz4",
        "-c",
        "log_min_duration_statement=500ms",
        "-c",
        "log_parameter_max_length=0",
        "-c",
        "log_parameter_max_length_on_error=0",
      ]
    ports: ["127.0.0.1:${DEV_DB_PORT:-5433}:5432"]
    volumes: ["pgdata_dev:/var/lib/postgresql"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U adsmcp -d adsmcp"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata_dev: {}
