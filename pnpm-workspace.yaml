packages: []

# Chuỗi cung ứng: chỉ nhận bản phát hành đã có ít nhất 3 ngày (bản bị chèn mã độc thường bị gỡ trong vài ngày đầu).
# KHÔNG bật trustPolicy: no-downgrade: pnpm 11 kiểm cả lockfile hiện có và từ chối 4 gói (cài --frozen-lockfile lỗi).
minimumReleaseAge: 4320

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  msw: false

# Ghim bản đã vá cho gói gián tiếp mà `pnpm update` không tự nâng (cảnh báo Dependabot 2026-10):
# fast-uri qua ajv (@hookform/resolvers, có trong image chạy thật); vite chỉ dùng cho vitest/msw (dev).
overrides:
  fast-uri: ^3.1.9
  vite: ^8.3.3
