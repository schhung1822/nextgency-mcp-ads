# Ads MCP by: Nextgency - TUỲ CHỌN cho phương án C (Nginx trên máy chủ): từ chối mọi request không gửi tới đúng
# tên miền đã cấu hình (quét theo IP, Host lạ) thay vì để Nginx trả site đầu tiên.
#   - Cổng 80: đóng kết nối không trả lời (444).
#   - Cổng 443: từ chối bắt tay TLS (ssl_reject_handshake, Nginx >= 1.19.4) nên không lộ chứng chỉ/tên miền.
# CHỈ dùng khi KHÔNG có site nào khác trên máy chủ đã khai báo `default_server` (vd site `default` của Ubuntu -
# đã gỡ ở docs/deploy-vps.md mục 10.4): hai `default_server` trên cùng cổng làm `nginx -t` báo lỗi.
# Cài:
#   sudo cp /opt/ads-mcp/deploy/nginx/default-deny.conf /etc/nginx/sites-available/default-deny.conf
#   sudo ln -sf /etc/nginx/sites-available/default-deny.conf /etc/nginx/sites-enabled/default-deny.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Gỡ: sudo rm /etc/nginx/sites-enabled/default-deny.conf && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
