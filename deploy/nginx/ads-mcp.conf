# Ads MCP by: noti.vn - Nginx reverse proxy trên máy chủ (phương án C, docs/deploy-vps.md).
# Tương đương Caddyfile: HTTPS (Certbot), che key MCP trong log, /mcp/ không buffer (SSE), body 1 MB, header bảo mật.
#
# Cài đặt (thay mcp.example.com bằng APP_DOMAIN của bạn):
#   1) .env: CADDY_REPLICAS=0 và WEB_HOST_PORT=3000 -> docker compose up -d --no-build
#      (web chỉ mở ở 127.0.0.1:3000; Caddy tắt để nhường cổng 80/443 cho Nginx)
#   2) sudo certbot certonly --nginx -d mcp.example.com --deploy-hook "systemctl reload nginx"
#   3) sudo cp deploy/nginx/ads-mcp.conf /etc/nginx/sites-available/ads-mcp.conf
#      sudo sed -i 's/mcp\.example\.com/mcp.congty.vn/g' /etc/nginx/sites-available/ads-mcp.conf
#      sudo ln -s /etc/nginx/sites-available/ads-mcp.conf /etc/nginx/sites-enabled/ads-mcp.conf
#   4) sudo nginx -t && sudo systemctl reload nginx
#   (tuỳ chọn) deploy/nginx/default-deny.conf: từ chối request tới IP/tên miền lạ - xem chú thích trong file đó.
# Viết cho Nginx >= 1.18 (Ubuntu 24.04 có 1.24, Debian 12 có 1.22): dùng `listen ... http2` thay vì `http2 on;`
# (Nginx >= 1.25.1 chỉ in cảnh báo "deprecated", vẫn chạy đúng).
#
# BẢO MẬT - IP KHÁCH: app CHỈ tin hop ĐẦU của X-Forwarded-For. Vì vậy file này GHI ĐÈ header đó bằng $remote_addr
# (proxy_set_header X-Forwarded-For $remote_addr). KHÔNG đổi thành $proxy_add_x_forwarded_for: biến đó NỐI THÊM vào
# giá trị khách tự gửi -> khách tự khai IP bất kỳ ở hop đầu -> né khoá đăng nhập/giới hạn MCP theo IP, allowlist IP
# của MCP bị vượt qua, nhật ký ghi sai IP.
# Đứng sau Cloudflare: bỏ dấu # ở 2 dòng `include .../cloudflare-realip.conf;` bên dưới (realip đặt $remote_addr =
# CF-Connecting-IP khi kết nối đến từ dải IP Cloudflare) - xem tài liệu.

# --- Log: che /mcp/<key> (key MCP là mật khẩu) ------------------------------------------------------------------
# Không bao giờ ghi $request, $request_uri, $uri thô (đều chứa key). Referer cũng có thể chứa link MCP.
map $request_uri $adsmcp_log_uri {
    default                                  $request_uri;
    "~^/mcp/[^/?#]+(?<adsmcp_uri_rest>.*)$"  "/mcp/[redacted]$adsmcp_uri_rest";
}
map $http_referer $adsmcp_log_referer {
    default                                                  $http_referer;
    "~^(?<adsmcp_ref_head>.*?)/mcp/[^/?#]+(?<adsmcp_ref_tail>.*)$"  "$adsmcp_ref_head/mcp/[redacted]$adsmcp_ref_tail";
}
log_format adsmcp_json escape=json
    '{"time":"$time_iso8601","client_ip":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$adsmcp_log_uri","protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"referer":"$adsmcp_log_referer","user_agent":"$http_user_agent"}';

upstream adsmcp_web {
    server 127.0.0.1:3000;    # = WEB_HOST_PORT trong .env
    keepalive 16;
}

# --- HTTP: chỉ chuyển hướng sang HTTPS (Certbot tự chèn tạm đường dẫn xác thực khi gia hạn bằng --nginx) -------
server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;
    server_tokens off;
    access_log /var/log/nginx/ads-mcp.access.log adsmcp_json;
    # include /opt/ads-mcp/deploy/nginx/cloudflare-realip.conf;   # bật khi đứng sau Cloudflare

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Mozilla "intermediate" (TLS 1.2 chỉ dùng AEAD + ECDHE; TLS 1.3 dùng bộ mặc định của OpenSSL).
    # KHÔNG thêm ssl_ecdh_curve X25519MLKEM768: OpenSSL 3.0 của Ubuntu 24.04 không có -> nginx không khởi động.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:adsmcp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Let's Encrypt đã ngừng OCSP (2025) -> không bật ssl_stapling.

    access_log /var/log/nginx/ads-mcp.access.log adsmcp_json;
    # include /opt/ads-mcp/deploy/nginx/cloudflare-realip.conf;   # bật khi đứng sau Cloudflare

    # Giao diện quản trị gửi form/server action nhỏ; Next tự giới hạn server action 1 MB.
    client_max_body_size 5m;

    # Header gửi vào app (giống Caddy): Host công khai (app kiểm tra Host = APP_DOMAIN cho MCP và Origin cho
    # server action), proto https, IP khách GHI ĐÈ (xem đầu file).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Header bảo mật: ẩn bản của app rồi đặt lại 1 lần (không nhân đôi), như Caddy.
    proxy_hide_header X-Powered-By;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    # Endpoint MCP: không buffer/nén (SSE), body tối đa 1 MB, không cache, timeout dài (app tự cắt gọi nền tảng
    # sau 60 s; Claude chờ tối đa ~4 phút/lệnh). Lỗi upstream của location này chỉ ghi mức crit: error_log của
    # Nginx in cả dòng request (có key) và KHÔNG che được bằng map.
    location /mcp/ {
        client_max_body_size 1m;
        proxy_pass http://adsmcp_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        error_log /var/log/nginx/ads-mcp.error.log crit;
    }

    location / {
        proxy_pass http://adsmcp_web;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_log /var/log/nginx/ads-mcp.error.log warn;
}
