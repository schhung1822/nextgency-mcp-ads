name: Docker image

# Phát hành bằng tag:  git tag v1.2.3 && git push origin v1.2.3   (tag phải trỏ vào commit đã có trên main)
#   - kiểm tra package.json#version khớp tag (lệch -> fail ngay, chưa build), tag nằm trên nhánh mặc định,
#     và bản vX.Y.Z chưa từng phát hành (không ghi đè image của bản đã phát hành - tạo bản vá mới)
#   - build + đẩy ghcr.io/schhung1822/nextgency-mcp-ads:<ver> (web/worker/migrate/cli) và ...-updater:<ver> (daemon cập nhật),
#     kèm SBOM + provenance, rồi KÝ cả 2 image bằng cosign keyless (OIDC của GitHub Actions). Updater của khách
#     chỉ nhận image có chữ ký của đúng workflow này cho đúng tag: image tự build/tự push tay sẽ bị từ chối.
#   - sau khi image đã có trên GHCR: tạo GitHub Release (nội dung: release-notes/<tag>.md) - CHỈ với tag đúng dạng vMAJOR.MINOR.PATCH
#     (tag có hậu tố như v1.2.3-rc.1 chỉ build image, không tạo Release nên admin không thấy là "bản mới")
# Push lên main KHÔNG build image (tiết kiệm phút Actions của repo private); chạy tay (workflow_dispatch) CHỈ trên
# nhánh mặc định thì đẩy :main / :sha-xxxx với APP_BUILD_VERSION=dev. Không gắn tag `latest`.
# Quy trình đầy đủ: .claude/docs/07-deployment.md §6.
# Mọi action ghim theo commit SHA (Dependabot đề xuất cập nhật); quyền token cấp riêng từng job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false # không bao giờ huỷ giữa chừng một lần đẩy image phát hành

env:
  IMAGE: ghcr.io/schhung1822/nextgency-mcp-ads
  IMAGE_UPDATER: ghcr.io/schhung1822/nextgency-mcp-ads-updater

jobs:
  build:
    name: Build, push & sign (amd64 + arm64)
    # tag, hoặc chạy tay trên nhánh mặc định (chạy tay trên nhánh khác bị bỏ qua)
    if: github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless: chứng chỉ ký gắn với workflow + tag này
    outputs:
      version: ${{ steps.ver.outputs.version }}
      stable: ${{ steps.ver.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # cần lịch sử nhánh mặc định để kiểm tra tag nằm trên đó
          persist-credentials: false

      # v1.2.3 -> APP_BUILD_VERSION=1.2.3 (phải bằng package.json#version) · nhánh/dispatch -> dev
      - id: ver
        name: Resolve version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              v[0-9]*) ;;
              *) echo "::error::Tag '$REF_NAME' không đúng dạng vMAJOR.MINOR.PATCH"; exit 1 ;;
            esac
            version="${REF_NAME#v}"
            pkg="$(node -p "require('./package.json').version")"
            if [ "$pkg" != "$version" ]; then
              echo "::error::package.json#version ($pkg) không khớp tag $REF_NAME. Sửa version rồi tạo lại tag."
              exit 1
            fi
            if printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then stable=true; else stable=false; fi
            # Gói GitHub Free không có tag ruleset: workflow tự chặn tag tạo trên nhánh chưa merge ...
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" \
              || { echo "::error::Tag $REF_NAME không trỏ vào commit trên $DEFAULT_BRANCH"; exit 1; }
            # ... và việc đẩy lại image của một bản đã phát hành (Release chỉ được tạo ở cuối, nên chạy lại
            # sau khi lỗi giữa chừng vẫn được)
            if [ "$stable" = true ] && gh release view "$REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$REF_NAME đã phát hành - không ghi đè image của bản đã phát hành (tạo bản vá mới)"; exit 1
            fi
          else
            version=dev
            stable=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "APP_BUILD_VERSION=$version (stable release: $stable)"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 → 1.2.3, 1.2, v1.2.3 · main → main, sha-xxxxxxx · KHÔNG gắn latest (compose luôn dùng APP_VERSION)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Ads MCP by: Nextgency
            org.opencontainers.image.vendor=Nextgency
            org.opencontainers.image.licenses=LicenseRef-Nextgency-Proprietary

      - id: meta-updater
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_UPDATER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,format=short
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Ads MCP by: Nextgency - updater
            org.opencontainers.image.vendor=Nextgency
            org.opencontainers.image.licenses=LicenseRef-Nextgency-Proprietary

      # Web/worker/migrate/cli image (target mặc định: runner)
      - id: build-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_BUILD_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Updater image: dùng lại layer builder đã có trong cache của bước trên
      - id: build-updater
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: updater
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_BUILD_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Ký digest (index multi-arch = digest mà `docker pull <tag>` ghi vào RepoDigests). Danh tính chứng chỉ:
      # https://github.com/schhung1822/nextgency-mcp-ads/.github/workflows/docker.yml@refs/tags/vX.Y.Z
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (cosign v3.0.6)
      - name: Sign images (cosign keyless, GitHub OIDC)
        env:
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
          DIGEST_UPD: ${{ steps.build-updater.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST_WEB}"
          cosign sign --yes "${IMAGE_UPDATER}@${DIGEST_UPD}"

  # Chỉ chạy khi cả 2 image đã được đẩy + ký xong và tag là bản chính thức vMAJOR.MINOR.PATCH
  release:
    name: GitHub Release
    needs: build
    if: github.ref_type == 'tag' && needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # release-notes/<tag>.md (Vietnamese, written by the maintainer) is the release body the admins read in
      # "Cài đặt → Cập nhật hệ thống"; auto-generated notes are only a fallback when the file is missing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release-notes
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG đã tồn tại, bỏ qua."
          elif [ -f "release-notes/$TAG.md" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "release-notes/$TAG.md"
          else
            echo "::warning::Thiếu release-notes/$TAG.md - dùng ghi chú tự sinh."
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
