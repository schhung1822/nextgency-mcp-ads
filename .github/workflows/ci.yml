name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: adsmcp
          POSTGRES_PASSWORD: adsmcp-ci
          POSTGRES_DB: adsmcp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U adsmcp -d adsmcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Giá trị giả, chỉ dùng trong CI. Script `pnpm db:migrate`/`cli` chạy `tsx --env-file=.env`:
    # biến môi trường của job được ưu tiên hơn nội dung .env (file .env trong CI rỗng).
    env:
      DATABASE_URL: postgres://adsmcp:adsmcp-ci@localhost:5432/adsmcp
      APP_DOMAIN: localhost
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
      ENCRYPTION_KEYS: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      MCP_KEY_PEPPER: "Y2ktb25seS1wZXBwZXItY2ktb25seS1wZXBwZXItMDA="  # base64 of 32 bytes (fake)
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # đọc version từ package.json#packageManager
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare .env
        run: touch .env

      - name: Lint
        run: pnpm lint

      # Bắt lỗi cú pháp/nội suy của docker-compose*.yml (giá trị giả, không chạy container)
      - name: Validate compose files
        env:
          APP_VERSION: 0.0.0
          POSTGRES_PASSWORD: ci-only
          ACME_EMAIL: ci@example.com
        run: |
          docker compose -f docker-compose.yml --profile updater config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml --profile updater config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Build (Next standalone + dist/*.mjs)
        run: |
          pnpm build
          test -f .next/standalone/server.js
          test -f dist/migrate.mjs && test -f dist/worker.mjs && test -f dist/cli.mjs
