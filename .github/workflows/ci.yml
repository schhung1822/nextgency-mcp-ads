name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: adsmcp
          POSTGRES_PASSWORD: adsmcp-ci
          POSTGRES_DB: adsmcp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U adsmcp -d adsmcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # Giá trị giả, chỉ dùng trong CI. Script `pnpm db:migrate`/`cli` chạy `tsx --env-file=.env`:
    # biến môi trường của job được ưu tiên hơn nội dung .env (file .env trong CI rỗng).
    env:
      DATABASE_URL: postgres://adsmcp:adsmcp-ci@localhost:5432/adsmcp
      APP_DOMAIN: localhost
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
      ENCRYPTION_KEYS: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      MCP_KEY_PEPPER: "Y2ktb25seS1wZXBwZXItY2ktb25seS1wZXBwZXItMDA="  # base64 of 32 bytes (fake)
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4   # đọc version từ package.json#packageManager

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare .env
        run: touch .env

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

      - name: Build (Next standalone + dist/*.mjs)
        run: |
          pnpm build
          test -f .next/standalone/server.js
          test -f dist/migrate.mjs && test -f dist/worker.mjs && test -f dist/cli.mjs
